name: Abuk Invest checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      FINNHUB_API_KEY: ""
      FINNHUB_BASE_URL: https://finnhub.io/api/v1
      MONGODB_URI: mongodb://127.0.0.1:27017/abuk_invest_ci
      BETTER_AUTH_SECRET: ci-only-secret-key-not-used-for-real-users-123456
      BETTER_AUTH_URL: http://localhost:3000
      GEMINI_API_KEY: ""
      NODEMAILER_EMAIL: ""
      NODEMAILER_PASSWORD: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
